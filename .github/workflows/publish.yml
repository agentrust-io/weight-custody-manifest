name: publish

# Publishes the SDK to PyPI via PyPI Trusted Publishing (OIDC) - no API token
# stored in the repo. A GitHub Release publishes to PyPI; a manual run publishes
# to TestPyPI for a dry run. See RELEASING.md for the one-time trusted-publisher
# setup on (Test)PyPI.
#
# NOTE: publishing puts the SDK SOURCE on a public index (the sdist/wheel contain
# the code). That is a deliberate go-public decision; cutting a Release is the
# trigger.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          cd python && python -m build --outdir ../dist
          twine check ../dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    # Manual dry run: publish to TestPyPI.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    # Real publish: only when a GitHub Release is published.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
