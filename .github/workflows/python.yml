name: python

on:
  push:
    branches: [main]
  pull_request:
    # Run on every PR. The public-repository ruleset requires packaging and all
    # three test jobs, so path filters would leave docs/governance PRs waiting
    # forever for required checks that never start.

permissions:
  contents: read

jobs:
  cryptography-compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install current supported dependency line and SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "cryptography>=50,<51"
      - name: Exercise current warning and future exception contracts
        run: pytest -q tests/test_certificate_policy.py tests/test_quote_verify.py tests/test_azure_vtpm_verify.py

  packaging:
    # The release path, exercised on every PR. `python -m build` builds the sdist,
    # unpacks it, and builds the wheel FROM THAT, which is a different filesystem
    # layout than the source tree: pyproject.toml sits at the sdist root, so
    # repo-root artifacts are beside it rather than at `../`. Invoking hatchling
    # directly does not go through that step, so a packaging bug can pass every
    # other job here and only surface when a Release is cut. That is exactly what
    # happened to 0.24.0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel the way the release does
        working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install FROM THE SDIST and run the shipped suite
        # From the sdist, not the wheel: installing the sdist forces a wheel build
        # out of it, which is the step that broke. And it proves the packaged
        # schema and vectors are actually reachable from an installed package.
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --quiet python/dist/*.tar.gz
          /tmp/sdist-venv/bin/python - <<'PY'
          import wcm
          from wcm.conformance import load_vectors
          assert wcm.manifest_schema()["$id"].endswith("/v1.json")
          assert len(load_vectors()) > 50, "vectors missing from the installed package"
          print("installed", wcm.__version__, "with", len(load_vectors()), "vectors")
          PY
          /tmp/sdist-venv/bin/wcm conformance

  downstream-examples:
    # The public demos in agentrust-io/examples, run against a wheel built from
    # THIS branch rather than against whatever is on PyPI.
    #
    # 0.27.0 is why. It shipped two correct security changes, and both broke
    # demos there: release began refusing manifests whose identity was not
    # pinned out of band (#98), and the memory-fingerprint challenge began
    # requiring a signed sweep (#95). Six demos that passed on 0.26.0 failed on
    # 0.27.0. Nothing caught it, because that repository only ever tests against
    # a version already published, so the earliest possible detection was after
    # the upload, which is after a version number can be taken back.
    #
    # A change here that breaks them now fails on the pull request that causes
    # it. That is not automatically a reason to revert: a security fix SHOULD
    # break a demo that was relying on the hole. It is a reason to know, and to
    # land the demo fix alongside rather than discover it afterwards.
    #
    # The list of what to run lives in that repository, next to the demos, as
    # run_demos.py. Duplicating it here is what created the gap in the first
    # place.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the wheel this branch would ship
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Check out the public examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agentrust-io/examples
          path: examples
          persist-credentials: false

      - name: Install the branch wheel over the pinned release
        # The examples pin a published floor in requirements.txt. Installing
        # those first and the local wheel second is deliberate: it brings in the
        # extras the demos need, then replaces the SDK with the one under
        # review. --force-reinstall because the pinned floor is often already
        # satisfied by the version being replaced.
        run: |
          python -m pip install -r examples/weight-custody-manifest/requirements.txt
          python -m pip install "model-signing>=1.1,<2" pytest
          python -m pip install --force-reinstall --no-deps python/dist/*.whl
          python -c "import wcm; print('testing against', wcm.__version__)"

      - name: Run every offline demo and the unit tests
        working-directory: examples/weight-custody-manifest
        run: python run_demos.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (mypy strict)
        run: mypy src/wcm
      - name: Security (bandit)
        run: bandit -q -c pyproject.toml -r src/wcm
      - name: Test
        run: pytest -q --cov=wcm --cov-report=term-missing
