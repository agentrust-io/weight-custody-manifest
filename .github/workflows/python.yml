name: python

on:
  push:
    branches: [main]
    # schema/ and conformance/ live outside python/ but the suite validates them
    # (tests/test_schema.py checks the committed schema against the generator and
    # both against the vector corpus), so a change to either must run these tests.
    paths:
      - "python/**"
      - "schema/**"
      - "conformance/**"
      - ".github/workflows/python.yml"
  pull_request:
    # schema/ and conformance/ live outside python/ but the suite validates them
    # (tests/test_schema.py checks the committed schema against the generator and
    # both against the vector corpus), so a change to either must run these tests.
    paths:
      - "python/**"
      - "schema/**"
      - "conformance/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (mypy strict)
        run: mypy src/wcm
      - name: Security (bandit)
        run: bandit -q -c pyproject.toml -r src/wcm
      - name: Test
        run: pytest -q --cov=wcm --cov-report=term-missing
