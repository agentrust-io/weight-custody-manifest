name: composed-software
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  composed-software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wcm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agentrust-io/cmcp
          ref: 2cdb168ce52020406ff0ef6cbc34447f0ea55aee
          path: cmcp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agentrust-io/ca2a
          ref: fc22c644846111c7f375446399e9097a73f93214
          path: ca2a
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install core source snapshots and test dependencies
        run: python -m pip install -e './wcm/python[dev]' -e ./cmcp -e ./ca2a
      - name: Compose provisioning, tool, peer and authorized disclosure
        run: python wcm/python/composed/run.py --cmcp-source cmcp --ca2a-source ca2a --output evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: composed-software-evidence
          path: evidence
          if-no-files-found: error
