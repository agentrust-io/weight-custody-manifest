name: boot-loader
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  measurement-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: virtee/sev-snp-measure
          ref: 8f2b337e38bc83f87cd30f3253cdfe8e3e12cc3a
          path: .measurement-tool
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./python pytest
      - name: Check pinned prediction, independent encoding and substitutions
        env:
          WCM_MEASUREMENT_TOOL: ${{ github.workspace }}/.measurement-tool
        run: python -m pytest -v python/tests/test_measurement_prediction.py --junitxml=measurement-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: measurement-prediction-results
          path: measurement-results.xml
  linux-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev cpio qemu-system-x86 flex bison bc libelf-dev libssl-dev
      - run: python -m pip install -e './python[dev]'
      - name: Exercise native handoff and deliberate weakening
        working-directory: python
        env:
          WCM_BOOT_LINUX_TESTS: '1'
        run: python -m pytest -v tests/test_boot_linux.py --junitxml=boot-loader-results.xml
      - name: Assemble actual broker runtime and verify installed imports
        run: |
          set -euo pipefail
          bash python/boot/build-runtime.sh "$RUNNER_TEMP/boot-one"
          bash python/boot/build-runtime.sh "$RUNNER_TEMP/boot-two"
          cmp "$RUNNER_TEMP/boot-one/runtime.tar" "$RUNNER_TEMP/boot-two/runtime.tar"
          cmp "$RUNNER_TEMP/boot-one/init" "$RUNNER_TEMP/boot-two/init"
          cmp "$RUNNER_TEMP/boot-one/initrd.cpio" "$RUNNER_TEMP/boot-two/initrd.cpio"
          mkdir "$RUNNER_TEMP/boot-extracted"
          cd "$RUNNER_TEMP/boot-extracted"
          cpio -id --quiet --no-preserve-owner < "$RUNNER_TEMP/boot-one/initrd.cpio"
          sudo chroot runtime /usr/local/bin/python3 -I -B -c 'import wcm.guest_broker, uvicorn; print("installed guest imports passed")'
          cd "$RUNNER_TEMP/boot-one"
          sha256sum runtime.tar init initrd.cpio > "$GITHUB_WORKSPACE/python/boot-digests.txt"
      - name: Build pinned-source test kernel
        run: bash python/boot/build-kernel.sh "$RUNNER_TEMP/boot-kernel"
      - name: Boot production refusal and explicit test-device images under TCG
        run: |
          python python/boot/qemu_smoke.py "$RUNNER_TEMP/boot-kernel/bzImage" \
            "$RUNNER_TEMP/boot-one/runtime.tar" "$RUNNER_TEMP/boot-one/initrd.cpio" \
            "$RUNNER_TEMP/boot-vm-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: boot-loader-results
          path: |
            python/boot-loader-results.xml
            python/boot-digests.txt
            ${{ runner.temp }}/boot-kernel/kernel.config
            ${{ runner.temp }}/boot-kernel/kernel-digests.txt
            ${{ runner.temp }}/boot-kernel/toolchain.txt
            ${{ runner.temp }}/boot-vm-evidence/*.json
            ${{ runner.temp }}/boot-vm-evidence/*.log
