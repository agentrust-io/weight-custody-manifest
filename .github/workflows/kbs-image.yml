name: kbs-image

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "schema/**"
      - "conformance/**"
      - ".github/workflows/kbs-image.yml"
      - ".dockerignore"
  pull_request:
    paths:
      - "python/docker/**"
      - "python/src/wcm/server.py"
      - "python/pyproject.toml"
      - "schema/**"
      - "conformance/**"
      - ".github/workflows/kbs-image.yml"
      - ".dockerignore"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the reference KBS image
        run: docker build -f python/docker/Dockerfile -t wcm-kbs:ci .

      - name: Run and health-check
        run: |
          docker run -d --name kbs -p 8080:8080 wcm-kbs:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'
          # /challenge issues a 64-hex nonce.
          curl -sf -X POST http://localhost:8080/challenge | grep -qE '"nonce": ?"[0-9a-f]{64}"'
          docker logs kbs
          docker rm -f kbs

      - name: Assert no build tooling reached the runtime image
        # The runtime stage installs the wheel with --no-deps against a
        # hash-locked closure, so hatchling must not be present.
        run: |
          if docker run --rm --entrypoint python wcm-kbs:ci -c "import hatchling" 2>/dev/null; then
            echo "::error::hatchling leaked into the runtime image"
            exit 1
          fi
          docker run --rm --entrypoint python wcm-kbs:ci -c "import wcm, wcm.schema; print('wcm', wcm.__version__, wcm.schema.SCHEMA_ID)"

      - name: Verify the build is reproducible
        # Builds twice (second with --no-cache) and compares the exported
        # filesystem CONTENT. Content rather than layer digests, because BuildKit
        # stamps build-time mtimes onto COPY destination directory entries that no
        # in-image normalization can reach, and content is what a KBS measurement
        # is about anyway. See the script header and docs/reproducible-kbs-image.md.
        run: ./python/docker/verify-reproducible.sh

      - name: Record the measurement reference
        run: |
          docker image inspect wcm-kbs:ci --format 'layers: {{json .RootFS.Layers}}'
          docker image inspect wcm-kbs:ci --format 'image id: {{.Id}}'
