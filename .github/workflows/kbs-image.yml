name: kbs-image

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "schema/**"
      - "conformance/**"
      - ".github/workflows/kbs-image.yml"
      - ".dockerignore"
  pull_request:
    paths:
      - "python/docker/**"
      - "python/src/wcm/server.py"
      - "python/pyproject.toml"
      - "schema/**"
      - "conformance/**"
      - ".github/workflows/kbs-image.yml"
      - ".dockerignore"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the reference KBS image
        run: docker build -f python/docker/Dockerfile -t wcm-kbs:ci .

      - name: Run and health-check
        run: |
          docker run -d --name kbs -p 8080:8080 wcm-kbs:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'
          # /challenge issues a 64-hex nonce.
          curl -sf -X POST http://localhost:8080/challenge | grep -qE '"nonce": ?"[0-9a-f]{64}"'
          docker logs kbs
          docker rm -f kbs

      - name: Assert no build tooling reached the runtime image
        # The runtime stage installs the wheel with --no-deps against a
        # hash-locked closure, so hatchling must not be present.
        run: |
          if docker run --rm --entrypoint python wcm-kbs:ci -c "import hatchling" 2>/dev/null; then
            echo "::error::hatchling leaked into the runtime image"
            exit 1
          fi
          docker run --rm --entrypoint python wcm-kbs:ci -c "import wcm, wcm.schema; print('wcm', wcm.__version__, wcm.schema.SCHEMA_ID)"

      - name: Rebuild from scratch and assert identical layers
        # The reproducibility claim, tested rather than asserted. --no-cache so
        # the second build genuinely redoes every step; reusing the cache would
        # make this pass trivially and prove nothing.
        #
        # Layer digests, not the image id: the image config carries a `created`
        # timestamp taken from wall-clock, so image ids differ by design while
        # the FILESYSTEM should not.
        run: |
          docker build --no-cache -f python/docker/Dockerfile -t wcm-kbs:ci2 .
          docker image inspect wcm-kbs:ci  --format '{{json .RootFS.Layers}}' > layers1.json
          docker image inspect wcm-kbs:ci2 --format '{{json .RootFS.Layers}}' > layers2.json
          echo "build 1: $(cat layers1.json)"
          echo "build 2: $(cat layers2.json)"
          if ! diff -u layers1.json layers2.json; then
            echo "::error::two builds of the same source produced different layers; the image is not reproducible"
            exit 1
          fi
          echo "reproducible: both builds produced identical layer digests"

      - name: Record the measurement reference
        run: |
          docker image inspect wcm-kbs:ci --format 'layers: {{json .RootFS.Layers}}'
          docker image inspect wcm-kbs:ci --format 'image id: {{.Id}}'
