name: leak-scan

# Scans the current source tree. Release archives are checked by publish.yml.

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak-scan:
    name: leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan working tree
        run: python tools/leak_scan.py
