name: leak-scan

# Runs on EVERY push and pull request, and again immediately before a release.
#
# The control this replaces was manual and point-in-time: two pre-flip scans
# (2026-08-06, 2026-08-13) both reported CLEAN and both were honest, and the
# leak landed 2026-08-16 -- three days after the last one. A scan that only
# runs when someone remembers to run it cannot bound exposure. See RCA-0008.

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak-scan:
    name: leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in a later commit is still public in
          # the earlier one, and the sdist is built from a checkout.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan working tree
        run: python tools/leak_scan.py
