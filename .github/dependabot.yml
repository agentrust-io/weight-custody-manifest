version: 2

updates:
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    # One PR per week for minor and patch updates. Majors still arrive
    # one at a time so a breaking change is reviewed on its own.
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # One PR per week for minor and patch updates. Majors still arrive
    # one at a time so a breaking change is reviewed on its own.
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The KBS image base is pinned by digest for reproducibility, which means it
  # does not pick up security updates on its own. Dependabot moving the digest is
  # what keeps the pin from going stale. Note that a base bump makes the image
  # measurement change, which is expected and is why the measurement is pinned
  # per release rather than assumed constant.
  - package-ecosystem: docker
    directory: /python/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
