[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weight-custody-manifest"
description = "Reference SDK for the Weight Custody Manifest (WCM): manifest signing and verification, attestation-gated key release, wipe-on-lapse custody, derivative lineage, transparency log, and quote verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgenTrust Authors", email = "imransiddique@live.com" }]
keywords = [
  "model-weights", "custody", "attestation", "confidential-computing",
  "tee", "sev-snp", "nvidia-cc", "trust", "hardware-attestation", "pydantic",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "cryptography>=50,<51",
]
dynamic = ["version"]

[project.optional-dependencies]
server = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.29",
]
model-signing = [
  "model-signing>=1.1,<2",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.10",
  "bandit[toml]>=1.7",
  "pip-audit>=2.7",
  "fastapi>=0.111,<1",
  "httpx>=0.27",
  "model-signing>=1.1,<2",
  # Only for tests/test_schema.py, which checks the published JSON Schema and the
  # Pydantic model accept and reject the same vectors. Not a runtime dependency:
  # wcm.schema hands back the schema document and leaves validation to the caller.
  "jsonschema>=4.21",
]

[project.scripts]
wcm = "wcm.cli:main"

# Every URL here must resolve for an ANONYMOUS reader. The repository is still
# private (#40, "Flip visibility to public"), so any github.com/agentrust-io/
# weight-custody-manifest link 404s for everyone who is not a member, and PyPI
# renders it as a live link regardless. Restore Source, Issues and Changelog in
# the same change that flips the repo, not before: #40 warned that a release cut
# ahead of the flip ships dead links, and v0.26.0 did exactly that.
[project.urls]
Homepage = "https://wcm.agentrust-io.com"
Documentation = "https://wcm.agentrust-io.com"
Examples = "https://github.com/agentrust-io/examples/tree/main/weight-custody-manifest"

[tool.hatch.build.targets.wheel]
packages = ["src/wcm"]

# The manifest JSON Schema and the conformance vectors are canonically at the REPO
# root, next to SPEC.md, because they are specification artifacts rather than
# Python ones. The wheel ships copies so wcm.schema and `wcm conformance` work from
# an installed package.
#
# A build HOOK rather than a static force-include, because their path depends on
# how the wheel is built: `../schema` from the source tree, but `schema` when the
# wheel is built from an unpacked sdist (where pyproject.toml is at the sdist root).
# `python -m build` does the latter, so a static path fails on the real release
# path. See hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "tools/", "README.md"]

# The sdist reaches a PUBLIC index regardless of this repository's visibility,
# which is the boundary RCA-0008 is about. This receipt is the one live-validation
# fixture still carrying a hardware identifier: an Azure SNP/vTPM device serial,
# plus the H100 model, driver, VBIOS and PCI address. It cannot be redacted in
# place because tests/test_paired_hardware_receipt.py pins its SHA-256, and that
# pin is what shows the receipt is the one the hardware actually produced.
#
# Excluding it from the sdist resolves that as a packaging question rather than an
# evidentiary one: the pin keeps working in the repository, where the test runs in
# CI, and the identifier stops being published. The test skips when the file is
# absent, which is the honest behaviour for a source distribution that does not
# ship internal evidence.
exclude = [
  "tests/fixtures/live-validation/weight-custody-manifest/paired-2026-08-20/paired-release.json",
]

# The sdist is built from python/, so the repo-root schema and the vector corpus
# that tests/test_schema.py reads have to be pulled in explicitly, or an sdist
# build cannot run its own test suite.
[tool.hatch.build.targets.sdist.force-include]
"../schema" = "schema"
"../conformance" = "conformance"

[tool.hatch.version]
path = "src/wcm/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# fcntl is Linux-only: the `type: ignore[attr-defined]` on fcntl.ioctl is needed
# under a win32 platform check but unused on Linux, so silence unused-ignore here.
[[tool.mypy.overrides]]
module = "wcm._hw_providers"
warn_unused_ignores = false

[tool.coverage.run]
source = ["src/wcm"]
omit = ["src/wcm/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
