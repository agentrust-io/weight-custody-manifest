[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weight-custody-manifest"
description = "Reference SDK for the Weight Custody Manifest (WCM): manifest signing and verification, attestation-gated key release, wipe-on-lapse custody, derivative lineage, transparency log, and quote verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Imran Siddique", email = "maintainers@agentrust-io.com" }]
keywords = [
  "model-weights", "custody", "attestation", "confidential-computing",
  "tee", "sev-snp", "nvidia-cc", "trust", "hardware-attestation", "pydantic",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "cryptography>=42,<50",
]
dynamic = ["version"]

[project.optional-dependencies]
server = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.29",
]
model-signing = [
  "model-signing>=1.1,<2",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.10",
  "bandit[toml]>=1.7",
  "pip-audit>=2.7",
  "fastapi>=0.111,<1",
  "httpx>=0.27",
  "model-signing>=1.1,<2",
  # Only for tests/test_schema.py, which checks the published JSON Schema and the
  # Pydantic model accept and reject the same vectors. Not a runtime dependency:
  # wcm.schema hands back the schema document and leaves validation to the caller.
  "jsonschema>=4.21",
]

[project.scripts]
wcm = "wcm.cli:main"

[project.urls]
# The spec/SDK repo is private for now, and Pages (wcm.agentrust-io.com) is not
# served while it is. Point these at public, live surfaces so the PyPI page has
# no dead links. Restore to the repo + docs site when it goes public.
Homepage = "https://github.com/agentrust-io/examples/tree/main/weight-custody-manifest"
Documentation = "https://github.com/agentrust-io/examples/tree/main/weight-custody-manifest"

[tool.hatch.build.targets.wheel]
packages = ["src/wcm"]

# The normative manifest JSON Schema is canonically at the REPO root (schema/),
# next to SPEC.md, because it is a specification artifact rather than a Python
# one. Ship a copy inside the package so wcm.schema works from an installed
# wheel, not only from a checkout.
[tool.hatch.build.targets.wheel.force-include]
"../schema/wcm-manifest-v1.schema.json" = "wcm/_schema/wcm-manifest-v1.schema.json"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "tools/", "README.md"]

# The sdist is built from python/, so the repo-root schema and the vector corpus
# that tests/test_schema.py reads have to be pulled in explicitly, or an sdist
# build cannot run its own test suite.
[tool.hatch.build.targets.sdist.force-include]
"../schema" = "schema"
"../conformance" = "conformance"

[tool.hatch.version]
path = "src/wcm/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# fcntl is Linux-only: the `type: ignore[attr-defined]` on fcntl.ioctl is needed
# under a win32 platform check but unused on Linux, so silence unused-ignore here.
[[tool.mypy.overrides]]
module = "wcm._hw_providers"
warn_unused_ignores = false

[tool.coverage.run]
source = ["src/wcm"]
omit = ["src/wcm/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
